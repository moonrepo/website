stack: "frontend"
layer: "application"

tasks:
  dev:
    command: "vite dev"
    preset: "server"

  lint-links:
    command: "node scripts/validateLinks.ts"
    inputs:
      - "content/**/*"
      - "scripts/validateLinks.ts"
      - "src/lib/source.ts"
      - "src/routes/**/*"

  test:
    command: "vitest run"
