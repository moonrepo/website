stack: "infrastructure"
layer: "configuration"

tasks:
  check:
    command: "biome check"

  check-fix:
    command: "biome check --write"
    preset: "utility"

  format:
    command: "biome format --write"
    preset: "utility"

  # Biome doesn't support MDX yet, so Prettier formats it
  prettier:
    command: 'prettier --check "**/*.mdx"'
    inputs:
      - "**/*.mdx"
      - ".prettierignore"
      - ".prettierrc.json"

  prettier-fix:
    command: 'prettier --write "**/*.mdx"'
    preset: "utility"
