stack: "infrastructure"
layer: "configuration"

tasks:
  check:
    command: "biome check"

  check-fix:
    command: "biome check --write"
    preset: "utility"

  format:
    command: "biome format --write"
    preset: "utility"

  prettier:
    command: 'prettier --check "**/*.{md,mdx}"'
    inputs:
      - "**/*.{md,mdx}"
      - ".prettierignore"
      - ".prettierrc.json"

  prettier-fix:
    command: 'prettier --write "**/*.{md,mdx}"'
    preset: "utility"
